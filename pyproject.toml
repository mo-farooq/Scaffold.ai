[project]
name = "scaffold"
version = "0.1.0"
description = "Learning Mode — a CLI harness that paces AI-assisted coding around learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.14.0",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as live integration tests",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaffold"]
